name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x app/android/gradlew

      - name: Run Unit Tests
        working-directory: app/android
        run: ./gradlew test

      - name: Assemble Release APK
        working-directory: app/android
        run: ./gradlew :app:assembleRelease

      - name: Package Release Asset
        run: |
          TAG_NAME="${{ github.ref_name }}"
          APK_SRC=$(find app/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "Error: Release APK not found in app/android/app/build/outputs/apk/release"
            exit 1
          fi
          
          APK_DEST="prima-focus-${TAG_NAME}.apk"
          cp "$APK_SRC" "$APK_DEST"
          echo "ASSET_APK=$APK_DEST" >> $GITHUB_ENV

      - name: Upload Release Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_APK }}
          draft: false
          prerelease: false
          generate_release_notes: true
